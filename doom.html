<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #dos { width: 100%; height: 100%; }
    .loading { color: #ff4444; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; }
    .loading p { margin: 4px 0; font-size: 12px; color: #999; }
    .loading .title { color: #ff4444; font-size: 14px; font-weight: bold; }
  </style>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
</head>
<body>
  <div id="loading" class="loading">
    <p class="title">Loading DOOM...</p>
    <p>Downloading shareware WAD (~6MB)</p>
    <p style="color:#666">Eskom willing, this should work...</p>
  </div>
  <div id="dos" style="display:none"></div>
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <script>
    function startDoom() {
      var el = document.getElementById('dos');
      var loadingEl = document.getElementById('loading');
      if (typeof window.Dos === 'function') {
        el.style.display = 'block';
        loadingEl.style.display = 'none';
        window.Dos(el, {
          url: 'doom.jsdos',
          autoStart: true
        });
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'doom-loaded' }, '*');
        }
      } else {
        loadingEl.innerHTML = '<p class="title" style="color:#ff4444">Failed to load js-dos</p><p>Try refreshing the page</p>';
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'doom-error', message: 'js-dos failed' }, '*');
        }
      }
    }
    // The script sets window.Dos synchronously at parse time, so it should be available
    // But give it a small delay just in case
    if (typeof window.Dos === 'function') {
      startDoom();
    } else {
      setTimeout(startDoom, 1000);
    }
  </script>
</body>
</html>
